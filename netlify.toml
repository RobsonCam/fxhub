# FX HUB · publicação no Netlify
# O site é estático (pasta public). Não há etapa de build no Netlify:
# o "python3 build.py" roda antes, no seu computador, e o resultado vai para o GitHub.

[build]
  publish = "public"
  command = ""

# Endereços amigáveis: tudo abre o mesmo app, que decide o que mostrar
#   /            sistema da equipe FX (também /painel)     /cliente   área do cliente
#   /site        site público          /c/bio  ou  /?l=bio   link de captação rastreado
#   /avaliar     avaliação mensal do cliente
# endereços do sistema antigo (FX Gestão) que já foram divulgados
[[redirects]]
  from = "/diagnostico"
  to = "/site"
  status = 301
[[redirects]]
  from = "/diagnostico.html"
  to = "/site"
  status = 301
[[redirects]]
  from = "/sistema"
  to = "/site"
  status = 301
[[redirects]]
  from = "/sistema.html"
  to = "/site"
  status = 301
[[redirects]]
  from = "/avaliacao"
  to = "/avaliar"
  status = 301
[[redirects]]
  from = "/avaliacao.html"
  to = "/avaliar"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# o app.js e o app.css mudam a cada publicação: o navegador sempre confere
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# app instalável: o service worker e os manifestos nunca ficam velhos no navegador
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
